<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#1a0a2e" />
  <title>Léa Studio</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">💜 <span>Léa</span> Studio</div>
      <div class="topbar-actions">
        <button type="button" class="icon-btn" id="btn-edit-toggle" title="Modifier">✏️</button>
      </div>
    </header>

    <main>
      <section id="view-discover" class="view"></section>
      <section id="view-profile" class="view hidden"></section>
      <section id="view-chat" class="view hidden"></section>
      <section id="view-settings" class="view hidden"></section>
    </main>

    <nav class="tabbar" id="tabbar">
      <button type="button" class="nav active" data-view="discover">🌟<span>Découvrir</span></button>
      <button type="button" class="nav" data-view="chat">💬<span>Chat</span></button>
      <button type="button" class="nav" data-view="settings">⚙️<span>Réglages</span></button>
    </nav>
  </div>

  <div id="lightbox" class="lightbox hidden" role="dialog">
    <button type="button" class="lb-close" id="lb-close">✕</button>
    <button type="button" class="lb-nav lb-prev" id="lb-prev">‹</button>
    <img id="lightbox-img" alt="Photo Léa" />
    <button type="button" class="lb-nav lb-next" id="lb-next">›</button>
  </div>

  <script src="native-api.js"></script>
  <script src="app.js"></script>
</body>
</html>
