<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Léa Studio</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <main>
      <section id="view-discover" class="view"></section>
      <section id="view-profile" class="view hidden"></section>
      <section id="view-chat" class="view hidden"></section>
      <section id="view-chats" class="view hidden"></section>
      <section id="view-memory" class="view hidden"></section>
      <section id="view-settings" class="view hidden"></section>
      <section id="view-studio" class="view hidden"></section>
    </main>
    <nav class="tabbar" id="tabbar">
      <button class="nav active" data-view="discover">Découvrir</button>
      <button class="nav" data-view="chats">Chats</button>
      <button class="nav" data-view="studio">Générer</button>
      <button class="nav" data-view="settings">Clés</button>
    </nav>
  </div>
  <script src="characters.js"></script>
  <script src="characters-extra.js"></script>
  <script src="native-api.js"></script>
  <script src="app.js"></script>
  <div id="lightbox" class="lightbox hidden" onclick="if(event.target===this)this.classList.add('hidden')">
    <button type="button" class="lb-nav lb-prev" id="lb-prev" title="Précédente">‹</button>
    <img id="lightbox-img" alt="Photo" />
    <button type="button" class="lb-nav lb-next" id="lb-next" title="Suivante">›</button>
    <div class="lb-actions">
      <button class="cta" id="lb-dl" type="button">Télécharger</button>
      <button class="cta" id="lb-bg" type="button">Utiliser comme fond</button>
      <button class="cta lb-close" type="button" onclick="document.getElementById('lightbox').classList.add('hidden')">Fermer</button>
    </div>
  </div>
</body>
</html>
