plugins {
    id "com.android.application"
}

def versionMajor = (project.findProperty("versionName") ?: "1.0.0")
def versionInt = (project.findProperty("versionCode") ?: "1").toInteger()

android {
    namespace "com.leastudio.app"
    compileSdk 34
    ndkVersion "26.1.10909125"
    defaultConfig {
        applicationId "com.leastudio.app"
        minSdk 24
        targetSdk 34
        versionCode versionInt
        versionName versionMajor
        ndk { abiFilters "arm64-v8a" }
        externalNativeBuild {
            cmake { arguments "-DANDROID_STL=c++_shared" }
        }
    }
    sourceSets {
        main { jniLibs.srcDirs = ["src/main/jni/prebuilt"] }
    }
    externalNativeBuild {
        cmake { path "src/main/jni/CMakeLists.txt" }
    }
    signingConfigs {
        release {
            storeFile file("lea-release.keystore")
            storePassword "leastudio"
            keyAlias "lea"
            keyPassword "leastudio"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}


dependencies {
}
