plugins {
    id "com.android.application"
}

def releaseVersion = new Properties()
rootProject.file("version.properties").withInputStream { releaseVersion.load(it) }
def versionMajor = releaseVersion.getProperty("versionName")
if (versionMajor == null || !(versionMajor ==~ /(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)/)) {
    throw new GradleException("versionName invalide dans android/version.properties (attendu : X.Y.Z)")
}
// Le nom vient toujours du fichier partagé, jamais d'un défaut propre à la CI.
if (project.hasProperty("versionName") && project.property("versionName").toString() != versionMajor) {
    throw new GradleException("Modifier android/version.properties pour changer versionName")
}
def minimumCode = releaseVersion.getProperty("versionCode")
def requestedCode = (project.findProperty("versionCode") ?: minimumCode)?.toString()
def validCode = { value ->
    value != null && (value ==~ /[1-9][0-9]{0,9}/) && value.toLong() <= 2100000000L
}
if (!validCode(minimumCode) || !validCode(requestedCode)) {
    throw new GradleException("versionCode invalide : entier Android positif requis")
}
def versionInt = requestedCode.toInteger()
if (minimumCode.toInteger() <= 666 || versionInt < minimumCode.toInteger()) {
    throw new GradleException("versionCode doit être >= ${minimumCode} et supérieur au dernier APK livré (666)")
}

android {
    namespace "com.leastudio.app"
    compileSdk 34
    ndkVersion "26.1.10909125"
    defaultConfig {
        applicationId "com.leastudio.app"
        minSdk 24
        targetSdk 34
        versionCode versionInt
        versionName versionMajor
        ndk { abiFilters "arm64-v8a" }
        externalNativeBuild {
            cmake { arguments "-DANDROID_STL=c++_shared" }
        }
    }
    sourceSets {
        main { jniLibs.srcDirs = ["src/main/jni/prebuilt"] }
    }
    packaging {
        jniLibs {
            pickFirsts += ["**/libc++_shared.so"]
        }
    }
    externalNativeBuild {
        cmake { path "src/main/jni/CMakeLists.txt" }
    }
    signingConfigs {
        release {
            storeFile file("lea-release.keystore")
            storePassword "leastudio"
            keyAlias "lea"
            keyPassword "leastudio"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += ["**/sd-arm64", "**/assets/native/sd-arm64"]
        }
    }
}


dependencies {
    implementation "org.opencv:opencv:4.12.0"
}
