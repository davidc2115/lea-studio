name: Build APK Android

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Nom de version affiché (ex: 1.0.1)"
        required: true
        default: "1.0.1"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "public/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    name: Build Léa Studio APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Android SDK (licences auto)
        run: |
          ANDROID_SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -sS -L -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          mv /tmp/cmdtools/cmdline-tools/* "$ANDROID_SDK_ROOT/cmdline-tools/latest/"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --licenses || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Build stable-diffusion.cpp CLI (arm64, upload séparé)
        run: |
          set -e
          NDK="$ANDROID_NDK_HOME"
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          mkdir -p android/app/src/main/assets/native
          echo "Binaire CLI téléchargé à la demande (Pack SD.cpp), pas embarqué dans l'APK." > android/app/src/main/assets/native/README.txt
          rm -f android/app/src/main/assets/native/sd-arm64
          if git clone --depth 1 --recursive https://github.com/leejet/stable-diffusion.cpp.git /tmp/sdcpp 2>/dev/null; then
            mkdir -p /tmp/sdcpp/build-android && cd /tmp/sdcpp/build-android
            cmake .. -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=arm64-v8a \
              -DANDROID_PLATFORM=android-28 \
              -DANDROID_STL=c++_shared \
              -DCMAKE_BUILD_TYPE=MinSizeRel \
              -DGGML_OPENMP=OFF \
              -DSD_BUILD_EXAMPLES=ON \
              -DSD_BUILD_SHARED_LIBS=OFF \
              -DSD_CUDA=OFF -DSD_VULKAN=OFF -DSD_OPENCL=OFF -DSD_METAL=OFF \
              || { echo "cmake SD skip"; echo "SD_BIN_OK=0" >> "$GITHUB_ENV"; exit 0; }
            cmake --build . --config MinSizeRel -j$(nproc) || { echo "build SD skip"; echo "SD_BIN_OK=0" >> "$GITHUB_ENV"; exit 0; }
            BIN=$(find . -type f -name "sd" -executable | head -1)
            if [ -z "$BIN" ]; then BIN=$(find . -type f -name "sd" | head -1); fi
            if [ -n "$BIN" ]; then
              "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-unneeded "$BIN" || true
              cp "$BIN" "$GITHUB_WORKSPACE/sd-arm64"
              chmod +x "$GITHUB_WORKSPACE/sd-arm64"
              echo "SD_BIN_OK=1" >> "$GITHUB_ENV"
              ls -la "$GITHUB_WORKSPACE/sd-arm64"
            else
              echo "SD_BIN_OK=0" >> "$GITHUB_ENV"
            fi
          else
            echo "SD_BIN_OK=0" >> "$GITHUB_ENV"
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"


      - name: Télécharger covers personnages
        run: |
          mkdir -p public/images/cast android/app/src/main/assets/www/images/cast
          curl -sSL -o /tmp/cast-covers.zip             "https://github.com/davidc2115/lea-studio/releases/download/covers-v1/cast-covers.zip" || true
          if [ -f /tmp/cast-covers.zip ]; then
            unzip -qo /tmp/cast-covers.zip -d /tmp/cast_unpack
            cp -n /tmp/cast_unpack/cast_covers/*.jpg public/images/cast/ 2>/dev/null || true
            cp -n /tmp/cast_unpack/cast_covers/*.jpg android/app/src/main/assets/www/images/cast/ 2>/dev/null || true
            echo "covers: $(ls public/images/cast 2>/dev/null | wc -l)"
          else
            echo "WARN: pas de pack covers"
          fi

      - name: Copier le frontend dans les assets
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -R public/. android/app/src/main/assets/www/
          # Jamais de binaire SD monstre dans assets
          rm -f android/app/src/main/assets/native/sd-arm64
          rm -f android/app/src/main/assets/www/native/sd-arm64
          find android/app/src/main/assets -name "sd-arm64" -delete 2>/dev/null || true
          # jni prebuilt: retirer libsd trop gros s'il existe
          if [ -f android/app/src/main/jni/prebuilt/arm64-v8a/libsd.so ]; then
            SZ=$(stat -c%s android/app/src/main/jni/prebuilt/arm64-v8a/libsd.so)
            if [ "$SZ" -gt 26214400 ]; then
              echo "Retrait prebuilt libsd.so trop gros ($SZ)"
              rm -f android/app/src/main/jni/prebuilt/arm64-v8a/libsd.so
            fi
          fi
          du -sh android/app/src/main/assets android/app/src/main/jni 2>/dev/null || true

      - name: Assemble APK signé
        working-directory: android
        run: |
          VERSION="${{ github.event.inputs.version || '1.0.0' }}"
          CODE="${{ github.run_number }}"
          gradle assembleRelease --no-daemon --stacktrace \
            -PversionName="$VERSION" \
            -PversionCode="$CODE"


      - name: Finaliser et vérifier l'APK
        run: |
          set -e
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -1)
          test -n "$APK"
          echo "APK source: $APK ($(du -h "$APK" | cut -f1))"
          # Interdire le monstre assets/native/sd-arm64
          if unzip -l "$APK" | grep -q "assets/native/sd-arm64"; then
            echo "Retrait sd-arm64 trop volumineux de l'APK..."
            zip -d "$APK" "assets/native/sd-arm64" || true
            ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$HOME/android-sdk}"
            APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort | tail -1)
            ZIPALIGN=$(find "$ANDROID_SDK_ROOT/build-tools" -name zipalign | sort | tail -1)
            "$ZIPALIGN" -f -p 4 "$APK" "${APK}.aligned"
            mv "${APK}.aligned" "$APK"
            "$APKSIGNER" sign --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
              --ks android/app/lea-release.keystore --ks-pass pass:leastudio --key-pass pass:leastudio --ks-key-alias lea "$APK"
          fi
          unzip -t "$APK" >/tmp/apk-test.txt
          echo "ZIP integrity OK"
          ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$HOME/android-sdk}"
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --verbose "$APK" || { echo "SIGNATURE INVALIDE"; exit 1; }
          # Taille max raisonnable (~80Mo)
          SIZE=$(stat -c%s "$APK")
          echo "APK bytes=$SIZE"
          if [ "$SIZE" -gt 90000000 ]; then
            echo "WARN: APK encore très gros ($SIZE)"
            unzip -l "$APK" | sort -n -k1 | tail -20
          fi
          VERSION="${{ github.event.inputs.version || '1.0.0' }}"
          CODE="${{ github.run_number }}"
          OUT="lea-studio-v${VERSION}-b${CODE}.apk"
          cp "$APK" "$OUT"
          cp "$APK" lea-studio.apk
          ls -lh "$OUT" lea-studio.apk
          unzip -l lea-studio.apk | grep -E "sd-arm64|libsd|classes.dex" || true

      - uses: actions/upload-artifact@v4
        with:
          name: lea-studio-apk
          path: lea-studio.apk
          retention-days: 90
          compression-level: 0
