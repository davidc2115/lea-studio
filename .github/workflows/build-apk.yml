name: Build APK Android

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version APK (ex: 1.0.0)"
        required: true
        default: "1.0.0"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "public/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    name: Build Léa Studio APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Copier le frontend dans les assets Android
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -R public/. android/app/src/main/assets/www/
          ls -la android/app/src/main/assets/www

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Assemble Debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Renommer l'APK
        run: |
          VERSION="${{ github.event.inputs.version || '1.0.0' }}"
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -1)
          test -n "$APK"
          cp "$APK" "lea-studio-v${VERSION}.apk"
          ls -lh "lea-studio-v${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: lea-studio-apk
          path: lea-studio-v*.apk
          retention-days: 90
