name: Build APK Android

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Nom de version affiché (ex: 1.0.1)"
        required: true
        default: "1.0.1"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "public/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    name: Build Léa Studio APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Android SDK (licences auto)
        run: |
          ANDROID_SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -sS -L -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          mv /tmp/cmdtools/cmdline-tools/* "$ANDROID_SDK_ROOT/cmdline-tools/latest/"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --licenses || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Build stable-diffusion.cpp (arm64 CPU)
        run: |
          set -e
          NDK="$ANDROID_NDK_HOME"
          git clone --depth 1 --recursive https://github.com/leejet/stable-diffusion.cpp.git /tmp/sdcpp
          mkdir -p /tmp/sdcpp/build-android
          cd /tmp/sdcpp/build-android
          cmake .. -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_OPENMP=OFF \
            -DSD_BUILD_EXAMPLES=ON \
            -DSD_BUILD_SHARED_LIBS=OFF \
            -DSD_CUDA=OFF -DSD_VULKAN=OFF -DSD_OPENCL=OFF -DSD_METAL=OFF
          cmake --build . --config Release -j$(nproc) || cmake --build . --config Release -j2
          # trouver le binaire sd
          BIN=$(find . -type f -name sd -o -name sd-cli 2>/dev/null | head -1)
          if [ -z "$BIN" ]; then
            BIN=$(find . -type f -executable | grep -E '/sd$|/sd-cli$' | head -1 || true)
          fi
          mkdir -p "$GITHUB_WORKSPACE/android/app/src/main/assets/native"
          # UNE SEULE copie : jni/prebuilt (évite Duplicate resources mergeReleaseJniLibFolders)
          mkdir -p "$GITHUB_WORKSPACE/android/app/src/main/jni/prebuilt/arm64-v8a"
          rm -f "$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a/libsd.so" 2>/dev/null || true
          if [ -n "$BIN" ] && [ -f "$BIN" ]; then
            cp "$BIN" "$GITHUB_WORKSPACE/android/app/src/main/assets/native/sd-arm64"
            cp "$BIN" "$GITHUB_WORKSPACE/android/app/src/main/jni/prebuilt/arm64-v8a/libsd.so"
            chmod +x "$GITHUB_WORKSPACE/android/app/src/main/jni/prebuilt/arm64-v8a/libsd.so"
            ls -lh "$GITHUB_WORKSPACE/android/app/src/main/jni/prebuilt/arm64-v8a/libsd.so"
            echo "SD_BIN_OK=1" >> "$GITHUB_ENV"
          else
            echo "WARN: binaire sd non trouvé — APK sans sd.cpp"
            find . -type f | head -50
            echo "SD_BIN_OK=0" >> "$GITHUB_ENV"
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"


      - name: Télécharger covers personnages
        run: |
          mkdir -p public/images/cast android/app/src/main/assets/www/images/cast
          curl -sSL -o /tmp/cast-covers.zip             "https://github.com/davidc2115/lea-studio/releases/download/covers-v1/cast-covers.zip" || true
          if [ -f /tmp/cast-covers.zip ]; then
            unzip -qo /tmp/cast-covers.zip -d /tmp/cast_unpack
            cp -n /tmp/cast_unpack/cast_covers/*.jpg public/images/cast/ 2>/dev/null || true
            cp -n /tmp/cast_unpack/cast_covers/*.jpg android/app/src/main/assets/www/images/cast/ 2>/dev/null || true
            # also copy gallery slots from cover if missing
            for f in public/images/cast/*.jpg; do
              base=$(basename "$f" .jpg)
              for i in 01 02 03 04 05; do
                [ -f "public/images/cast/${base}-${i}.jpg" ] || cp "$f" "public/images/cast/${base}-${i}.jpg"
                [ -f "android/app/src/main/assets/www/images/cast/${base}-${i}.jpg" ] || cp "$f" "android/app/src/main/assets/www/images/cast/${base}-${i}.jpg"
              done
            done
            echo "covers: $(ls public/images/cast | wc -l)"
          else
            echo "WARN: pas de pack covers"
          fi

      - name: Copier le frontend dans les assets
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -R public/. android/app/src/main/assets/www/

      - name: Assemble APK signé
        working-directory: android
        run: |
          VERSION="${{ github.event.inputs.version || '1.0.0' }}"
          CODE="${{ github.run_number }}"
          gradle assembleRelease --no-daemon --stacktrace \
            -PversionName="$VERSION" \
            -PversionCode="$CODE"


      - name: Vérifier libsd.so dans APK
        run: |
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -1)
          echo "APK=$APK"
          unzip -l "$APK" | grep -E "libsd|sd-arm64" || true
          if ! unzip -l "$APK" | grep -q "lib/arm64-v8a/libsd.so"; then
            echo "ERREUR: libsd.so absent de l'APK — injection forcée"
            WORK=$(mktemp -d)
            cp "$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a/libsd.so" "$WORK/libsd.so" ||               cp "$GITHUB_WORKSPACE/android/app/src/main/assets/native/sd-arm64" "$WORK/libsd.so"
            (
              cd "$WORK"
              mkdir -p lib/arm64-v8a
              cp libsd.so lib/arm64-v8a/libsd.so
              zip -u -X "$OLDPWD/$APK" lib/arm64-v8a/libsd.so
            )
            # re-sign
            ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$HOME/android-sdk}"
            APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort | tail -1)
            ZIPALIGN=$(find "$ANDROID_SDK_ROOT/build-tools" -name zipalign | sort | tail -1)
            "$ZIPALIGN" -f -p 4 "$APK" "$APK.aligned"
            mv "$APK.aligned" "$APK"
            "$APKSIGNER" sign --ks android/app/lea-release.keystore --ks-pass pass:leastudio --key-pass pass:leastudio --ks-key-alias lea "$APK"
            unzip -l "$APK" | grep libsd.so
          else
            echo "OK libsd.so présent"
          fi

      - name: Renommer l'APK
        run: |
          VERSION="${{ github.event.inputs.version || '1.0.0' }}"
          CODE="${{ github.run_number }}"
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -1)
          test -n "$APK"
          cp "$APK" "lea-studio-v${VERSION}-b${CODE}.apk"
          ls -lh "lea-studio-v${VERSION}-b${CODE}.apk"
          echo "SD_BIN_OK=${SD_BIN_OK:-0}"

      - uses: actions/upload-artifact@v4
        with:
          name: lea-studio-apk
          path: lea-studio-v*.apk
          retention-days: 90
